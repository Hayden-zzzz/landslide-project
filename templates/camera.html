{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto bg-white rounded-xl shadow-xl p-6">
    <h2 class="text-2xl font-bold text-gray-800 flex items-center">
        <i class="fas fa-video text-red-600 mr-3"></i> Live Camera Feed
    </h2>
    <div class="mt-4 bg-black rounded-lg overflow-hidden flex items-center justify-center relative" style="height: 450px;">
        <!-- Placeholder image with overlay -->
        <img src="https://via.placeholder.com/800x450/2d3748/4a5568?text=RTSP+Stream+Placeholder" 
             alt="Camera feed" class="object-cover w-full h-full">
        <div class="absolute top-2 left-2 bg-red-600 text-white text-xs px-2 py-1 rounded-full flex items-center">
            <span class="w-2 h-2 bg-white rounded-full mr-1 animate-pulse"></span> LIVE
        </div>
        <div class="absolute bottom-4 right-4 bg-black bg-opacity-50 text-white text-xs px-3 py-1 rounded-full">
            <i class="fas fa-camera"></i> RTSP
        </div>
    </div>
    <p class="text-gray-500 mt-3 text-sm flex items-center">
        <i class="fas fa-info-circle text-blue-400 mr-2"></i> 
        Replace the placeholder with your RTSP stream URL. 
        Use <code class="bg-gray-100 px-2 py-1 rounded text-xs">/video_feed</code> endpoint for Flask streaming.
    </p>
</div>
{% endblock %}
