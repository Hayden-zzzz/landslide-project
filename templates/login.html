{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-xl p-8">
    <div class="text-center mb-6">
        <i class="fas fa-mountain text-5xl text-blue-600"></i>
        <h2 class="text-2xl font-bold mt-2">Welcome Back</h2>
        <p class="text-gray-500">Sign in to access the monitoring system</p>
    </div>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-gray-700 font-medium"><i class="fas fa-user mr-2"></i>Username</label>
            <input type="text" name="username" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition">
        </div>
        <div>
            <label class="block text-gray-700 font-medium"><i class="fas fa-lock mr-2"></i>Password</label>
            <input type="password" name="password" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition">
        </div>
        <button type="submit" class="w-full btn-primary font-bold py-2 rounded-lg transition flex items-center justify-center space-x-2">
            <i class="fas fa-sign-in-alt"></i>
            <span>Login</span>
        </button>
    </form>
    <p class="mt-4 text-center text-gray-600">Don't have an account? <a href="{{ url_for('signup') }}" class="text-blue-600 hover:underline">Sign up</a></p>
</div>
{% endblock %}
